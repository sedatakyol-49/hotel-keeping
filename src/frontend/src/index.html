<!doctype html>
<!-- `lang` niteligi uygulama acilisinda LanguageService tarafindan guncellenir. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>HotelCore</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="HotelCore — Hotelverwaltung" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HotelCore" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-maskable.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Yazi tipleri kendi origin'imizden; harici <link> YASAK (giris ekrani
         herkese aciktir). Gerekce, alt kume ve preload karari:
         projects/shared/styles/fonts.css. Kapi: npm run verify:fonts. -->
    <link
      rel="preload"
      href="fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <hc-root></hc-root>
    <noscript>
      HotelCore benötigt JavaScript. — HotelCore requires JavaScript. — HotelCore JavaScript
      gerektirir.
    </noscript>
  </body>
</html>
