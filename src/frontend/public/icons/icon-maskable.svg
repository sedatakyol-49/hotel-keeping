<!--
  Maskable ikon: platform bunu daire/squircle maskeyle kirpar. Kare cerceve
  guvenli bolgeye (merkezdeki %80 daire) sigmadigi icin bu varyantta cerceve
  cizilmez — lacivert zemin zaten "plaka" gorevini gorur. Isaret %70 olcekle
  ortalandi: koseleri de dahil tum cizim guvenli daire icinde kalir.
-->
