<!--
  Uygulama ikonu — `shared/ui/brand-mark` ile ayni "HS" geometrisi (viewBox 32).
  Tek fark cerceve kalinligi: bilesende cerceve `vector-effect="non-scaling-stroke"`
  ile her olcekte tam 1px'tir; burada dosya isletim sistemi/tarayici tarafindan
  rasterize edildigi icin cerceve **oransal** (1.25 birim) cizilir — 16px'te de
  512px'te de gorunur kalir.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-labelledby="hc-icon-title">
