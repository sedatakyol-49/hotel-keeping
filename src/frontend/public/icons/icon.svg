  <rect width="32" height="32" fill="#f4f1ea"/>
  <rect x="0.625" y="0.625" width="30.75" height="30.75" fill="none" stroke="#16150f" stroke-width="1.25"/>
  <path d="M3 4.5h3v20H3zM11.5 4.5h3v20h-3zM3 13h11.5v3H3z" fill="#16150f"/>
  <path d="M26.73 7.81A4.25 4.25 0 1 0 23.25 14.5a4.25 4.25 0 1 1-3.48 6.69" fill="none" stroke="#16150f" stroke-width="3"/>
  <rect x="3" y="26.5" width="26" height="1.5" fill="#a9662f"/>
</svg>
