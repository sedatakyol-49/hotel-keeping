<!doctype html>
<!--
  `lang` niteligi rota dilinden yazilir (GuestLanguageService). SSR sirasinda da
  yazildigi icin sunucudan cikan HTML dogru dili bildirir — arama motoru ve
  ekran okuyucu ikisi de bu nitelige bakar.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>HotelCore</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbf9f4" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-maskable.svg" />
    <!-- Yazi tipleri kendi origin'imizden; harici <link> YASAK. Gerekce ve
         alt kume karari: projects/shared/styles/fonts.css. Kapi: verify:fonts.
         (Bu yorum SSR ciktisina da girer; kisa tutulmasi bilinclidir.) -->
    <link
      rel="preload"
      href="fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <hcg-root></hcg-root>
    <noscript>
      HotelCore benötigt JavaScript für die Buchung. — HotelCore requires JavaScript for booking. —
      HotelCore rezervasyon için JavaScript gerektirir.
    </noscript>
  </body>
</html>
