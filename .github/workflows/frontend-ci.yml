# Frontend CI — Angular 22 / Vitest
#
# Akis: npm ci -> lint -> hukuki anlik goruntu denetimi -> test (headless, watch kapali)
#       -> production build (IKI uygulama; misafir sitesi SSR + prerender)
#       -> prerender ciktisinin dogrulanmasi.
# Node surumu src/frontend/.nvmrc'den okunur (package.json > engines ile uyumlu).
#
# WORKSPACE'TE IKI UYGULAMA VAR: yonetim paneli (hotelcore-web, CSR) ve misafir
# sitesi (guest-web, SSR + prerender). `npm run build` / `npm run test` sarmalayici
# betiklerdir ve ikisini de kapsar (Angular 22'de `defaultProject` yoktur).
#
# BU IS AKISI BIR API'YE BAGLI DEGILDIR: hukuki metinler derleme oncesi alinmis bir
# anlik goruntuden gelir (src/frontend/projects/guest-web/src/generated/legal-snapshot.json,
# `npm run legal:snapshot` ile uretilir). Boylece frontend derlemesi calisan bir
# backend + veritabani istemez ve CI'a hicbir sir eklenmez.
#
# SSR DAGITIMI: `node dist/guest-web/server/server.mjs` calistirilirken
# SSR_ALLOWED_HOSTS ortam degiskeni gercek alan adlarini (virgulle) tasimalidir;
# aksi halde sunucu yalnizca "localhost" Host basligina yanit verir. Bu bir sir
# degildir ama dagitim ortaminda verilir, is akisinda degil.

name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Angular CLI'nin CI'da analytics/prompt sormasini engelle.
  NG_CLI_ANALYTICS: 'false'
  CI: 'true'

jobs:
  build-and-test:
    name: Lint, Test & Build (Angular 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # package-lock.json'a birebir sadik, tekrarlanabilir kurulum.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # §5 DDG: prerender edilen Impressum icerigini bu dosyadan alir. Eksik veya bozuk
      # olursa hukuki sayfalar JavaScript'siz ziyaretcide BOS kalir — build yine yesil
      # olurdu, bu yuzden ayri bir kapi.
      - name: Verify legal snapshot (§5 DDG)
        run: npm run legal:snapshot:check

      # scripts/run-tests.mjs sarmalayicisi `--run` bayragini `ng test --watch=false`a cevirir.
      # Iki uygulamayi da kapsar (yonetim paneli + misafir sitesi).
      - name: Unit tests (Vitest — admin + guest)
        run: npm run test -- --run

      # Iki uygulama derlenir; misafir sitesinde ayrica prerender + SSR sunucusu uretilir.
      # Sarmalayici, prerender sirasinda DUSEN istekleri (Angular bunlari yazip cikis kodu 0
      # ile devam eder) yakalar ve derlemeyi kirar.
      - name: Build (production — admin + guest SSR/prerender)
        run: npm run build

      # Derleme "basarili" olup icerigi eksik sayfa uretmesi mumkundur (gercekten oldu).
      # Betik uc kapiyi denetler: iki uygulamanin ciktisi + SSR paketi; prerender kumesinin
      # YALNIZCA hukuki sayfalar olmasi ve gercek metin tasimasi; ve SSR sunucusunun ana
      # sayfa katalogunu HTML'e basmasi (sahte origin ile, backend gerekmez).
      - name: Verify build output (prerender content + SSR smoke)
        run: npm run verify:build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/**
          if-no-files-found: warn
          retention-days: 14
